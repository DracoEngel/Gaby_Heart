<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gaby</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: false });

    const BLUE_SHADES = [
      "#3b82f6", "#60a5fa",
      "#93c5fd", "#2563eb",
      "#bfdbfe", "#1d4ed8",
      "#38bdf8", "#22d3ee",
      "#7dd3fc", "#e0f2fe",
    ];
    const NAME = "Gaby";
    const FLOAT_COUNT = 140;
    const HEART_COUNT = 5600;

    const rgbCache = {};
    function hexToRgb(hex) {
      if (rgbCache[hex]) return rgbCache[hex];
      const n = parseInt(hex.slice(1), 16);
      return (rgbCache[hex] = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 });
    }
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];

    let width = 0, height = 0, dpr = 1;
    let cx = 0, cy = 0, scale = 1;
    let angle = 0, pulse = 1;
    let phase = "form";
    let phaseT = 0;
    let nameAlpha = 0;

    const floatParticles = [];
    const heartParticles = [];
    const burstParticles = [];

    function heart2D(t) {
      return {
        x: 16 * Math.sin(t) ** 3,
        y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t),
      };
    }

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = width / 2;
      cy = height * 0.44;
      scale = Math.min(width, height) * 0.018;
    }

    class Particle {
      constructor(x, y, type) {
        this.reset(x, y, type);
      }

      reset(x, y, type) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.size = rand(0.9, 2.4);
        this.color = pick(BLUE_SHADES);
        this.life = 0;
        this.maxLife = rand(90, 200);
        this.twinkle = Math.random() * Math.PI * 2;
        if (type === "float") {
          this.vx = rand(-0.18, 0.18);
          this.vy = rand(-0.5, -0.1);
          this.size = rand(0.8, 1.8);
        } else if (type === "burst") {
          const a = rand(-0.9, 0.9) + Math.PI * 0.5;
          const sp = rand(1.2, 5.5);
          this.vx = Math.cos(a) * sp * 0.7;
          this.vy = Math.abs(Math.sin(a) * sp) + rand(0.6, 3.2);
          this.size = rand(1.2, 2.8);
          this.maxLife = rand(50, 110);
          this.color = pick(["#38bdf8", "#22d3ee", "#7dd3fc", "#60a5fa", "#93c5fd"]);
        }
      }
    }

    function initFloat() {
      floatParticles.length = 0;
      for (let i = 0; i < FLOAT_COUNT; i++) {
        const p = new Particle(Math.random() * width, Math.random() * height, "float");
        p.life = Math.random() * p.maxLife;
        floatParticles.push(p);
      }
    }

    function buildHeartCloud() {
      heartParticles.length = 0;
      for (let i = 0; i < HEART_COUNT; i++) {
        const t = rand(0, Math.PI * 2);
        const edge = Math.random() < 0.48;
        const fill = edge ? rand(0.88, 1.04) : Math.pow(Math.random(), 0.55) * 0.9;
        const h = heart2D(t);
        const px = (h.x / 16.5) * fill;
        const py = (h.y / 16.5) * fill;
        const thickness = 0.34 * Math.sqrt(Math.max(0.02, 1 - fill * fill * 0.65));
        const pz = rand(-1, 1) * thickness;
        const isCleft = py > 0.38 && Math.abs(px) < 0.16;
        if (isCleft && Math.random() < 0.55) continue;
        const isTip = py < -0.72;
        const palette = isCleft
          ? ["#38bdf8", "#7dd3fc", "#60a5fa"]
          : Math.random() < 0.1
            ? ["#93c5fd", "#7dd3fc", "#bfdbfe"]
            : ["#1d4ed8", "#2563eb", "#3b82f6", "#1e40af", "#60a5fa"];
        heartParticles.push({
          bx: px, by: py, bz: pz,
          x0: px, y0: py, z0: pz,
          sx: 0, sy: 0, depth: 1,
          vx: 0, vy: 0, vz: 0,
          size: isCleft ? rand(1.2, 1.9) : edge ? rand(1.0, 1.7) : rand(0.6, 1.2),
          color: pick(palette),
          alphaMul: isTip ? 0.45 : 1,
          twinkle: Math.random() * Math.PI * 2,
          twSpeed: rand(0.05, 0.14),
          delay: Math.random() * 0.55,
        });
      }
    }

    function projectHeart(rotY) {
      // Oscilación leve: el corazón sigue de frente, como en el video.
      const yaw = 0.28 * Math.sin(rotY);
      const cosY = Math.cos(yaw);
      const sinY = Math.sin(yaw);
      const tilt = 0.18;
      const cosX = Math.cos(tilt);
      const sinX = Math.sin(tilt);
      const s = scale * 13.6 * pulse;

      for (const p of heartParticles) {
        const jx = Math.sin(p.twinkle * 1.7) * 0.018;
        const jy = Math.cos(p.twinkle * 1.3) * 0.014;
        const jz = Math.sin(p.twinkle * 0.9) * 0.02;
        const x = p.x0 + jx;
        const y = p.y0 + jy;
        const z = p.z0 + jz;
        const rx = x * cosY - z * sinY;
        const rz = x * sinY + z * cosY;
        const ry = p.y0 * cosX - rz * sinX;
        const rz2 = p.y0 * sinX + rz * cosX;
        const persp = 1.2 / (1.2 + rz2 * 0.5);
        p.sx = cx + rx * s * persp;
        p.sy = cy - ry * s * persp;
        p.depth = persp;
      }
    }

    function spawnHeartBurst(x, y) {
      burstParticles.length = 0;
      for (let i = 0; i < 140; i++) {
        burstParticles.push(new Particle(x, y, "burst"));
      }
      for (const p of heartParticles) {
        p.vx = rand(-0.25, 0.25);
        p.vy = 0;
        p.vz = rand(-0.2, 0.2);
      }
    }

    function drawDot(x, y, size, hex, alpha) {
      const { r, g, b } = hexToRgb(hex);
      ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(0.85, alpha)})`;
      ctx.fillRect(x - size * 0.5, y - size * 0.5, size, size);
    }

    function drawGlowBase(intensity) {
      const by = cy + scale * 16.4;
      const g = ctx.createRadialGradient(cx, by, 1, cx, by, scale * 16);
      g.addColorStop(0, `rgba(56,189,248,${0.42 * intensity})`);
      g.addColorStop(0.22, `rgba(34,211,238,${0.28 * intensity})`);
      g.addColorStop(0.5, `rgba(37,99,235,${0.1 * intensity})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(cx, by, scale * 13.5, scale * 3.1, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawName() {
      if (nameAlpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = nameAlpha;
      ctx.font = `700 ${Math.min(width, height) * 0.09}px "Segoe UI", system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 42;
      ctx.fillStyle = "#7dd3fc";
      ctx.fillText(NAME, cx, cy);
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#ffffff";
      ctx.fillText(NAME, cx, cy);
      ctx.restore();
    }

    function emitBurst(n) {
      for (let i = 0; i < n; i++) {
        burstParticles.push(new Particle(
          cx + rand(-50, 50),
          cy + scale * 8 + rand(0, 40),
          "burst"
        ));
      }
    }

    function tick() {
      window.__phase = phase;
      window.__phaseT = phaseT;
      phaseT++;
      pulse = 1 + 0.028 * Math.sin(phaseT * 0.06);

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = "lighter";

      for (const p of floatParticles) {
        p.life++;
        p.twinkle += 0.1;
        p.x += p.vx;
        p.y += p.vy;
        if (p.life >= p.maxLife || p.y < -10) {
          p.reset(Math.random() * width, height + rand(0, 40), "float");
          p.life = Math.random() * 30;
        }
        const a = (1 - p.life / p.maxLife) * 0.55 * (0.55 + 0.45 * Math.sin(p.twinkle));
        drawDot(p.x, p.y, p.size, p.color, a);
      }

      if (phase === "form" || phase === "spin") {
        angle += phase === "spin" ? 0.012 : 0.006;
        projectHeart(angle);
        const appear = phase === "form" ? Math.min(1, phaseT / 50) : 1;
        drawGlowBase(0.45 + 0.55 * appear);

        for (const p of heartParticles) {
          if (p.delay > appear + 0.15) continue;
          p.twinkle += p.twSpeed;
          const spark = 0.55 + 0.45 * Math.abs(Math.sin(p.twinkle));
          const a = appear * spark * (0.28 + 0.5 * p.depth) * p.alphaMul;
          drawDot(p.sx, p.sy, p.size * p.depth, p.color, a);
        }

        if (phase === "form" && phaseT > 80) {
          phase = "spin";
          phaseT = 0;
        } else if (phase === "spin" && phaseT > 280) {
          spawnHeartBurst(cx, cy + scale * 8);
          phase = "explode";
          phaseT = 0;
        }
      } else if (phase === "explode") {
        const melt = Math.min(1, phaseT / 90);
        if (phaseT < 110) emitBurst(6);
        angle += 0.01;
        drawGlowBase(0.85 + melt * 0.5);

        for (const p of heartParticles) {
          const fromBottom = Math.max(0, 0.85 - p.by);
          const sag = melt * (0.08 + fromBottom * 0.85);
          const spread = 1 + melt * 0.22 * fromBottom;
          p.x0 = p.bx * spread + Math.sin(p.twinkle + phaseT * 0.08) * melt * 0.08;
          p.y0 = p.by - sag + Math.cos(p.twinkle * 1.4) * melt * 0.05;
          p.z0 = p.bz + Math.sin(p.twinkle * 0.7) * melt * 0.06;
          p.twinkle += p.twSpeed * (1.2 + melt);
        }
        projectHeart(angle);

        const fade = Math.max(0.22, 1 - Math.max(0, phaseT - 150) / 140);
        for (const p of heartParticles) {
          const spark = 0.5 + 0.5 * Math.abs(Math.sin(p.twinkle));
          drawDot(p.sx, p.sy, p.size * p.depth, p.color, spark * fade * p.alphaMul * (0.35 + 0.5 * p.depth));
        }

        for (let i = burstParticles.length - 1; i >= 0; i--) {
          const p = burstParticles[i];
          p.life++;
          p.vx *= 0.988;
          p.vy += 0.05;
          p.x += p.vx;
          p.y += p.vy;
          const a = Math.max(0, 1 - p.life / p.maxLife);
          if (a <= 0) {
            burstParticles.splice(i, 1);
            continue;
          }
          drawDot(p.x, p.y, p.size * (0.9 + a), p.color, a * 0.85);
        }

        if (phaseT > 130) nameAlpha = Math.min(1, nameAlpha + 0.025);
        drawName();
        if (phaseT > 280) {
          phase = "name";
          phaseT = 0;
        }
      } else {
        nameAlpha = Math.min(1, nameAlpha + 0.02);
        drawGlowBase(0.35);
        for (const p of heartParticles) {
          p.x0 += (p.bx - p.x0) * 0.04;
          p.y0 += (p.by - p.y0) * 0.04;
          p.z0 += (p.bz - p.z0) * 0.04;
        }
        angle += 0.01;
        projectHeart(angle);
        for (const p of heartParticles) {
          p.twinkle += p.twSpeed;
          const spark = 0.45 + 0.4 * Math.abs(Math.sin(p.twinkle));
          drawDot(p.sx, p.sy, p.size * p.depth * 0.85, p.color, spark * 0.28);
        }
        drawName();
        if (phaseT > 200) {
          angle = 0;
          nameAlpha = 0;
          burstParticles.length = 0;
          buildHeartCloud();
          phase = "form";
          phaseT = 0;
        }
      }

      requestAnimationFrame(tick);
    }

    canvas.addEventListener("click", (e) => {
      if (phase === "form" || phase === "spin") {
        spawnHeartBurst(e.clientX, e.clientY);
        phase = "explode";
        phaseT = 0;
        nameAlpha = 0;
      } else {
        angle = 0;
        nameAlpha = 0;
        burstParticles.length = 0;
        buildHeartCloud();
        phase = "form";
        phaseT = 0;
      }
    });

    window.addEventListener("resize", () => {
      resize();
      initFloat();
    });

    resize();
    initFloat();
    buildHeartCloud();
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, width, height);
    tick();
  </script>
</body>
</html>
